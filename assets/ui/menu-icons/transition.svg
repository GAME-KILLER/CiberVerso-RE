<?xml version="1.0" standalone="yes"?>
<!-- Setas de troca de vez (referência: buff.webp / assets/ui/status/buff.webp).
     3 chevrons ">" apontando para a direita, MESMA altura externa e braços
     paralelos (mesmo ângulo). Grossura cresce em passo uniforme (22/28/34)
     em direção à ponta. O espaçamento horizontal de cada chevron é calculado
     para que o GAP VISÍVEL (claro) entre eles seja IGUAL: chevrons mais
     grossos precisam de mais distância de centro a centro. Nada é cortado. -->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200">
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 42.1 14 L 138.1 100 L 42.1 186" stroke-width="22"/>
    <path d="M 124.5 14 L 220.5 100 L 124.5 186" stroke-width="28"/>
    <path d="M 215.9 14 L 311.9 100 L 215.9 186" stroke-width="34"/>
  </g>
</svg>
