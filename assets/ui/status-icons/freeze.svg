<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <filter id="neon-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/></feMerge>
    </filter>
  </defs>

  <!--
    Ampulheta angular/geométrica — path único fechado:
    Traceja todo o contorno externo em uma única linha contínua.
    Topo: barra horizontal → triângulo desce ao centro
    Centro: pescoço estreito
    Base: triângulo desce → barra horizontal
  -->

  <!-- Camada 1: Glow -->
  <path d="
    M 300 120
    L 900 120
    L 900 180
    L 640 560
    L 640 640
    L 900 1020
    L 900 1080
    L 300 1080
    L 300 1020
    L 560 640
    L 560 560
    L 300 180
    Z
  " fill="none" stroke="#60a5fa" stroke-width="24" filter="url(#neon-glow)" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Camada 2: Bevel -->
  <path d="
    M 300 120
    L 900 120
    L 900 180
    L 640 560
    L 640 640
    L 900 1020
    L 900 1080
    L 300 1080
    L 300 1020
    L 560 640
    L 560 560
    L 300 180
    Z
  " fill="none" stroke="#1e3a6e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Camada 3: Corpo principal -->
  <path d="
    M 300 120
    L 900 120
    L 900 180
    L 640 560
    L 640 640
    L 900 1020
    L 900 1080
    L 300 1080
    L 300 1020
    L 560 640
    L 560 560
    L 300 180
    Z
  " fill="none" stroke="#60a5fa" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Camada 4: Highlight central -->
  <path d="
    M 300 120
    L 900 120
    L 900 180
    L 640 560
    L 640 640
    L 900 1020
    L 900 1080
    L 300 1080
    L 300 1020
    L 560 640
    L 560 560
    L 300 180
    Z
  " fill="none" stroke="#d6e8ff" stroke-width="5" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Detalhe opcional: grãos caindo (linhas soltas fora da silhueta) -->
  <line x1="590" y1="680" x2="590" y2="740" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="610" y1="700" x2="610" y2="760" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
