<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <filter id="neon-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/></feMerge>
    </filter>
  </defs>

  <!-- Path principal: gota de sangue simétrica, fechada, angular -->
  <path d="
    M 600 80
    L 860 420
    L 680 560
    L 780 1120
    L 600 840
    L 420 1120
    L 520 560
    L 240 420
    Z
  " fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Camada 1: Glow -->
  <path d="
    M 600 80
    L 860 420
    L 680 560
    L 780 1120
    L 600 840
    L 420 1120
    L 520 560
    L 240 420
    Z
  " fill="none" stroke="#D42020" stroke-width="24" filter="url(#neon-glow)" opacity="0.55"/>

  <!-- Camada 2: Bevel -->
  <path d="
    M 600 80
    L 860 420
    L 680 560
    L 780 1120
    L 600 840
    L 420 1120
    L 520 560
    L 240 420
    Z
  " fill="none" stroke="#5C0A0A" stroke-width="20"/>

  <!-- Camada 3: Corpo principal -->
  <path d="
    M 600 80
    L 860 420
    L 680 560
    L 780 1120
    L 600 840
    L 420 1120
    L 520 560
    L 240 420
    Z
  " fill="none" stroke="#D42020" stroke-width="15"/>

  <!-- Camada 4: Highlight central -->
  <path d="
    M 600 80
    L 860 420
    L 680 560
    L 780 1120
    L 600 840
    L 420 1120
    L 520 560
    L 240 420
    Z
  " fill="none" stroke="#FFC9C9" stroke-width="5" opacity="0.7"/>
</svg>
