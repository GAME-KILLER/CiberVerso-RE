<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Borda saturada: ciano elétrico na ponta -> roxo vivo na cauda -->
    <linearGradient id="cvEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffd9"/>
      <stop offset="1" stop-color="#9b30ff"/>
    </linearGradient>
    <!-- Vidro com tinta (não cinza): escuro ciano -> escuro roxo -->
    <linearGradient id="cvGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2531"/>
      <stop offset="1" stop-color="#1e0f3a"/>
    </linearGradient>
    <filter id="cvGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <!-- Forma: só a ponta da seta, sem cauda, com cantos arredondados,
         autorada num viewBox de 24. Para mexer no desenho, altere o `d`. -->
    <path id="cvArrow" d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87a.5.5 0 0 0 .35-.85L6.35 2.85a.5.5 0 0 0-.85.35Z"/>
  </defs>

  <!-- Reescala 1.5x e põe o vértice no hotspot (2 2) -->
  <g transform="translate(2 2) scale(1.5) translate(-5.5 -3.21)">
    <!-- halo neon -->
    <use href="#cvArrow" fill="url(#cvEdge)" filter="url(#cvGlow)" opacity="0.5"/>
    <!-- corpo: vidro com tinta e a borda fina em gradiente (1.4 no espaço de
         24 = ~2px na imagem de 32) -->
    <use href="#cvArrow" fill="url(#cvGlass)" stroke="url(#cvEdge)" stroke-width="1.4"/>
  </g>
</svg>
